# Publishes the reusable workflows in this repo (shared-*.yml) by moving the
# sliding `v1` tag to the current main commit. Caller repos reference the shared
# workflows at `@v1`, so advancing the tag propagates a vetted change to them.
#
# Runs only when a shared-*.yml file or this publisher changes; the apply
# pipeline in infrastructure.yml is fenced off from those same paths so editing
# a shared workflow never reprovisions the fleet.
name: Publish shared workflows

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/shared-*.yml'
      - '.github/workflows/publish-shared-workflows.yml'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # Gate the tag move on a clean lint — a reusable workflow can only be
      # smoke-tested by a caller, so this is the cheapest guard before blessing
      # a new version.
      - name: Lint workflows
        uses: reviewdog/action-actionlint@1129829fb3230509a1c9aa4e93cec2b234746a68  # v1.78.0
        with:
          reporter: local
          # The 'local' reporter has no diff to filter against.
          filter_mode: nofilter
          fail_level: error

      - name: Move the v1 tag to this commit
        run: |
          git tag -f v1
          git push -f origin v1
