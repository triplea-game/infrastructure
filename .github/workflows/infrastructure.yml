name: Infrastructure

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:  # manual run on any branch — treated as apply if on main

# Actions are pinned to commit SHAs, not tags: a moved tag would run attacker
# code with the fleet SSH key and the Linode/vault secrets below.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancelling a PR preview is harmless; cancelling an apply on main is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  terraform:
    name: Terraform ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && 'apply' || 'plan' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: true
      TF_VAR_linode_token: ${{ secrets.LINODE_TOKEN }}
      TF_TOKEN_app_terraform_io: ${{  secrets.TF_TOKEN_APP_TERRAFORM_IO }}
    defaults:
      run:
        working-directory: terraform/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6  # v2.0.0

      - name: Terraform Init
        run: just init

      - name: Terraform Validate
        run: just validate

      - name: Terraform Plan
        if: github.event_name == 'pull_request'
        run: just plan

      - name: Terraform Apply
        if: >
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main'
        run: just apply-now

  ansible:
    name: Ansible ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && 'apply' || 'diff' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: terraform
    env:
      TRIPLEA_ANSIBLE_VAULT_PASSWORD: ${{ secrets.TRIPLEA_ANSIBLE_VAULT_PASSWORD }}
      LINODE_TOKEN: ${{ secrets.LINODE_TOKEN }}
    defaults:
      run:
        working-directory: ansible/
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: webfactory/ssh-agent@dc588b651fe13675774614f8e6a936a468676387  # v0.9.0
        with:
          ssh-private-key: ${{ secrets.INFRASTRUCTURE_SSH_PRIVATE_KEY }}

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5.4.2
      - uses: extractions/setup-just@dd310ad5a97d8e7b41793f8ef055398d51ad4de6  # v2.0.0

      - name: Install Ansible + ansible-lint
        run: |
          just install-ansible
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Lint gate — runs on every event, so a lint failure blocks the apply below.
      - name: Ansible Lint (verify)
        run: just verify

      - name: Ansible Diff (PR preview)
        if: github.event_name == 'pull_request'
        run: SSH_USER=ansible just diff

      - name: Ansible Apply
        if: >
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
          && github.ref == 'refs/heads/main'
        run: SSH_USER=ansible just apply
