---
# Clone the repo to the server's app directory
# sudo git clone https://github.com/triplea-project/forums.git /srv/triplea-forums

# Create the data directories that docker-compose.yml mounts

# Copy the example config to the host path that docker-compose.yml mounts
# sudo cp /srv/triplea-forums/node-bb/example/config.json /opt/triplea-forums/config.json
# sudo nano /opt/triplea-forums/config.json

- name: Create triplea-forums directory
  become: true
  ansible.builtin.file:
    state: directory
    mode: "0755"
    owner: root
    group: root
    path: "{{ item }}"
  with_items:
    - "{{ forums_working_directory }}"

- name: Deploy config.json file
  become: true
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ forums_working_directory }}/config.json"
    # Holds the nodebb session secret and the Postgres password, so it stays
    # owner-only; nodebb runs as uid 1001 and rewrites config.json during
    # 'nodebb upgrade' migrations, so 1001 still reads and writes it.
    mode: "0600"
    owner: "1001"
    group: "1001"

- name: Deploy templates
  become: true
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    # docker-compose.yml embeds POSTGRES_PASSWORD; every reader is root —
    # 'forums.service', 'deploy-forums.sh' under sudo, and root's backup cron.
    mode: "0640"
    owner: root
    group: root
  with_items:
    - src: docker-compose.yml.j2
      dest: "{{ nodebb_docker_compose_path }}"

- name: Create directories
  become: true
  ansible.builtin.file:
    state: directory
    mode: "0755"
    owner: 1001
    group: 1001
    path: "{{ forums_working_directory }}/{{ item }}"
  with_items:
    - uploads
    - uploads/category
    - uploads/emoji
    - uploads/files
    - uploads/profile
    - uploads/sounds
    - uploads/system

- name: Deploy systemctl service file for forums
  become: true
  ansible.builtin.template:
    src: forums.service.j2
    dest: /etc/systemd/system/forums.service
    owner: root
    group: admin
    mode: "0644"

- name: Daemon-reload and enable forums service
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: forums.service
    enabled: true

- name: Configure Forums Deployment User - deploy-user
  block:
    - name: Deploy /usr/local/bin/deploy-forums.sh
      become: true
      ansible.builtin.template:
        src: deploy-forums.sh.j2
        dest: /usr/local/bin/deploy-forums.sh
        owner: root
        group: root
        mode: "0755"

    - name: Deploy sudoers entry for deploy user - /etc/sudoers.d/deploy-forums
      become: true
      ansible.builtin.template:
        src: deploy-forums-sudoers.j2
        dest: /etc/sudoers.d/deploy-forums
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s

- name: Configure Forums Backup
  block:
    - name: Assert the lobby host (receiver for the offsite backup) is in inventory
      ansible.builtin.assert:
        that:
          - groups['lobby'] | default([]) | length > 0
        fail_msg: >-
          No lobby host found in inventory. backup.sh rsyncs nightly to
          forums-backup@prod.triplea-game.org, provisioned by the lobby host's
          forums_backup_target role; a --limit forums apply against an
          inventory without a lobby host would deploy a cron doomed to fail
          every night.

    - name: Deploy backup-user private key
      become: true
      ansible.builtin.template:
        src: backup_user_private_key.j2
        dest: "{{ backup_ssh_key_path }}"
        owner: root
        group: root
        mode: "0600"
    - name: Deploy backup script
      become: true
      ansible.builtin.template:
        src: backup.sh.j2
        dest: "{{ forums_working_directory }}/backup.sh"
        owner: root
        group: admin
        mode: "0755"
    - name: Schedule nightly backup cron job
      become: true
      ansible.builtin.cron:
        name: triplea-forums-backup
        user: root
        hour: "7"
        minute: "0"
        job: "{{ forums_working_directory }}/backup.sh >> /var/log/triplea-forums-backup.log 2>&1"

- name: Deploy logrotate config for forums and nodebb logs
  become: true
  ansible.builtin.copy:
    src: logrotate-forums
    dest: /etc/logrotate.d/forums
    owner: root
    group: root
    mode: "0644"
