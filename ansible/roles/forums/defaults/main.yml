---
forums_working_directory: /opt/triplea-forums

nodebb_uploads_directory: "{{ forums_working_directory }}/uploads"
nodebb_docker_compose_path: "{{ forums_working_directory }}/docker-compose.yml"

# nginx vhost (tasks/nginx.yml)
forums_hostname: forums.triplea-game.org
# Loopback port the compose file publishes NodeBB on; nginx proxies to it.
nodebb_port: 4567
# Generated by hand on the host ('openssl dhparam'), not by this role.
forums_dhparam_path: /etc/dhparam/dhparams.pem
forums_max_body_size: 4096K
# Per-IP rate on /login, /register and the v3 login API; 'burst' is how many
# requests over the rate are still served before nginx answers 429.
forums_login_rate: 30r/m
forums_login_burst: 20
# Private key 'backup.sh' pushes with; the lobby host authorizes its public half
# under an 'rrsync -wo' forced command, so it grants a write-only rsync into the
# backup directory and nothing more (see the 'lobby/forums_backup_target' role).
backup_ssh_key_path: "/root/.ssh/backup-user_key"

