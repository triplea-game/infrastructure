---
- name: Create marti group
  become: true
  ansible.builtin.group:
    name: marti
    state: present

- name: Create marti user
  become: true
  ansible.builtin.user:
    name: marti
    group: marti
    groups: docker
    state: present
    system: true
    create_home: false

- name: Look up the marti account
  ansible.builtin.getent:
    database: passwd
    key: marti
    fail_key: false

# The compose stack runs as this uid/gid so the signing key can stay owner-only.
# 'getent' is read-only and so also reports under --check; on a first-ever deploy
# in check mode the account does not exist yet and the lookup yields nothing, so
# fall back to the account name to keep the compose template renderable for the
# diff.
- name: Record the marti uid and gid
  vars:
    marti_passwd_entry: "{{ ansible_facts.getent_passwd['marti'] | default(['x', 'marti', 'marti'], true) }}"
  ansible.builtin.set_fact:
    marti_uid: "{{ marti_passwd_entry[1] }}"
    marti_gid: "{{ marti_passwd_entry[2] }}"

- name: Create marti working directory
  become: true
  ansible.builtin.file:
    state: directory
    mode: "0755"
    owner: marti
    group: marti
    path: "{{ marti_working_directory }}"

- name: Create keys directory
  become: true
  ansible.builtin.file:
    state: directory
    mode: "0750"
    owner: marti
    group: marti
    path: "{{ marti_working_directory }}/keys"

- name: Generate RSA private key (first deploy only)
  become: true
  ansible.builtin.command:
    cmd: openssl genrsa -out {{ marti_working_directory }}/keys/privkey.pem 4096
    creates: "{{ marti_working_directory }}/keys/privkey.pem"

- name: Set private key permissions
  become: true
  ansible.builtin.file:
    path: "{{ marti_working_directory }}/keys/privkey.pem"
    mode: "0400"
    owner: marti
    group: marti

- name: Generate RSA public key (first deploy only)
  become: true
  ansible.builtin.command:
    cmd: >
      openssl rsa
      -in {{ marti_working_directory }}/keys/privkey.pem
      -outform PEM -pubout
      -out {{ marti_working_directory }}/keys/pubkey.pem
    creates: "{{ marti_working_directory }}/keys/pubkey.pem"

- name: Set public key permissions
  become: true
  ansible.builtin.file:
    path: "{{ marti_working_directory }}/keys/pubkey.pem"
    mode: "0444"
    owner: marti
    group: marti

- name: Deploy docker-compose.yml
  notify: Restart_marti
  become: true
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ marti_working_directory }}/docker-compose.yml"
    mode: "0644"
    owner: marti
    group: marti

- name: Deploy config.json
  become: true
  ansible.builtin.template:
    src: config.json.j2
    dest: "{{ marti_working_directory }}/config.json"
    mode: "0644"
    owner: marti
    group: marti

- name: Deploy .env
  become: true
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ marti_working_directory }}/.env"
    mode: "0600"
    owner: marti
    group: marti

- name: Deploy marti systemd service
  notify: Restart_marti
  become: true
  register: sysctl_file
  ansible.builtin.template:
    src: marti.service.j2
    dest: /etc/systemd/system/marti.service
    mode: "0644"
    owner: root
    group: root

- name: Daemon-reload and enable marti service
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: marti.service
    enabled: true
    state: started

- name: Configure user for CICD deployments - user named 'deploy'
  block:
    # Root-owned rather than marti-owned: the sudoers Cmnd_Alias lets 'deploy'
    # run this as 'marti', so 'marti' needs execute on it but must not be able
    # to edit what 'deploy' will run.
    - name: Deploy deploy-marti.sh
      become: true
      ansible.builtin.template:
        src: deploy-marti.sh.j2
        dest: "{{ marti_working_directory }}/deploy-marti.sh"
        owner: root
        group: root
        mode: "0755"

    - name: Deploy sudoers entry for deploy user - /etc/sudoers.d/deploy-marti
      become: true
      ansible.builtin.template:
        src: deploy-marti-sudoers.j2
        dest: /etc/sudoers.d/deploy-marti
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
