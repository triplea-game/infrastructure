---
# Install instructions from: https://docs.docker.com/engine/install/ubuntu/
- name: Add docker signing key
  become: true
  ansible.builtin.copy:
    src: gpg
    dest: /etc/apt/keyrings/docker.asc
    owner: root
    mode: "0644"

- name: Add apt repo listing
  become: true
  tags: apt
  ansible.builtin.copy:
    src: docker.list
    dest: /etc/apt/sources.list.d/docker.list
    owner: root
    group: root
    mode: "0644"

- name: Apt update
  become: true
  tags: apt
  register: docker_apt_update
  # A host that opts in via 'apt_upgrade_nonfatal' has a known-broken apt source;
  # its cache refresh must not abort the cross-service apply. Mirrors the guard on
  # the upgrade task in the 'apt_packages' role.
  ignore_errors: "{{ apt_upgrade_nonfatal | default(false) }}"
  ansible.builtin.apt:
    update_cache: true

- name: Install docker packages
  become: true
  tags: apt
  ansible.builtin.apt:
    update_cache: false
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-compose-plugin
  environment:
    DEBIAN_FRONTEND: noninteractive

# live-restore lets running containers survive a dockerd restart/reload instead
# of being torn down with the daemon. Without it, any docker restart — a version
# upgrade, or needrestart bouncing the service after a library upgrade — kills
# every container on the host at once; on bot hosts that drops all live games.
- name: Configure docker daemon (live-restore)
  become: true
  ansible.builtin.copy:
    src: daemon.json
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
  notify: Reload docker

# Keep the container runtime out of needrestart's automatic-restart set (see the
# conf file for why). The directory exists once needrestart is installed; create
# it defensively so the drop-in never fails the apply.
- name: Ensure needrestart conf.d directory exists
  become: true
  ansible.builtin.file:
    path: /etc/needrestart/conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Exclude docker and containerd from needrestart auto-restart
  become: true
  ansible.builtin.copy:
    src: needrestart-no-docker.conf
    dest: /etc/needrestart/conf.d/no-restart-docker.conf
    owner: root
    group: root
    mode: "0644"

- name: Create docker group, add users to this group to allow them to run docker without sudo
  become: true
  ansible.builtin.group:
    name: docker
    state: present

# Every service updates by pulling a new ':latest', orphaning the prior image
# as dangling layers that nothing ever reclaims — worst on the 1GB bot Nanodes.
# Reclaims dangling images, stopped containers, unused networks, and build
# cache; never '-a' and never '--volumes', so live images and Postgres data
# volumes are untouched. Output goes to syslog (journald/rsyslog, already
# capped) rather than a fresh unbounded log file.
- name: Schedule weekly docker prune to reclaim dangling images and build cache
  become: true
  ansible.builtin.cron:
    name: docker-system-prune
    user: root
    weekday: "0"
    hour: "4"
    minute: "30"
    job: "docker system prune -f 2>&1 | logger -t docker-prune"

