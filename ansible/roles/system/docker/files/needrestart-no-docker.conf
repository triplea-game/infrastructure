# needrestart runs in automatic mode (NEEDRESTART_MODE=a, set in playbook.yml) so
# an unattended 'apt upgrade' never blocks on its interactive prompt. The side
# effect is that a library upgrade would auto-restart the container runtime, and
# restarting dockerd/containerd tears down every container on the host at once —
# on bot hosts that drops all live games. Exclude the runtime here: 'live-restore'
# already keeps containers running across a same-version daemon reload, and a real
# docker/containerd version upgrade is applied deliberately, not mid-apply.
#
# This is a Perl fragment eval'd by needrestart; override_rc maps a unit-name
# regex to 0 (never restart) or 1 (restart).
$nrconf{override_rc}{qr(^docker\.service$)} = 0;
$nrconf{override_rc}{qr(^containerd\.service$)} = 0;
