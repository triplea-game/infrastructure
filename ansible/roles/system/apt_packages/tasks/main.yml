---
# The discontinued 'webupd8team/java' PPA (Oracle Java 8 installer, trusty era)
# survived on at least the forums host as a live source signed by an rsa1024
# key in the legacy 'trusted.gpg' keyring. A legacy-keyring key is trusted for
# every source, not just its own, so it stays a trust anchor until removed; it
# is also what broke 'apt-get update' there. Idempotent and a no-op on hosts
# that never had it.
- name: Find sources files for the dead 'webupd8team/java' PPA
  become: true
  ansible.builtin.find:
    paths: /etc/apt/sources.list.d
    patterns: "*webupd8team*"
  register: webupd8team_sources

- name: Remove sources files for the dead 'webupd8team/java' PPA
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ webupd8team_sources.files }}"
  loop_control:
    label: "{{ item.path }}"

- name: Remove any 'webupd8team/java' line from /etc/apt/sources.list
  become: true
  ansible.builtin.lineinfile:
    path: /etc/apt/sources.list
    regexp: 'ppa\.launchpad\.net/webupd8team/java'
    state: absent

- name: Remove the 'webupd8team/java' signing key from the legacy keyring
  become: true
  ansible.builtin.apt_key:
    id: 7B2C3B0889BF5709A105D03AC2518248EEA14886
    state: absent

- name: Update and upgrade apt packages
  become: true
  check_mode: false
  changed_when: false
  register: apt_upgrade
  # A broken apt source on a host that opts in via 'apt_upgrade_nonfatal' must
  # not abort the cross-service apply; every other host stays strict and fails
  # loud, matching the critical-singleton rule in playbook.yml.
  ignore_errors: "{{ apt_upgrade_nonfatal | default(false) }}"
  ansible.builtin.apt:
    upgrade: true
    update_cache: true
    cache_valid_time: 86400 # One day, only updates if caches are older than this.
    autoremove: true

- name: Apt install standard utilities and packages
  become: true
  ansible.builtin.apt:
    state: present
    name:
      - fail2ban
      - htop
      - iftop
      - net-tools
      - unattended-upgrades
      - unzip
