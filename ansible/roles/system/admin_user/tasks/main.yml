---
- name: Removed admins - reject a name that is also in admins.json
  ansible.builtin.assert:
    that: admin_users | map(attribute='name') | intersect(removed_admins) | length == 0
    fail_msg: >-
      Listed in both terraform/keys/admins.json and removed_admins:
      {{ admin_users | map(attribute='name') | intersect(removed_admins) | join(', ') }}.
      Drop each name from one of the two lists.
    quiet: true
  run_once: true

# Sudo is revoked on every host before the account task runs, so removing the
# connecting account would strand the run halfway across the fleet.
- name: Removed admins - reject the account this run connects as
  ansible.builtin.assert:
    that: ansible_user not in removed_admins
    fail_msg: >-
      '{{ ansible_user }}' is in removed_admins but is the account this run connects as.
      Remove it in a run that connects as a different admin.
    quiet: true
  run_once: true

- name: Ensure admin user group & docker user group exist
  become: true
  ansible.builtin.group:
    name: "{{ item }}"
    state: present
  with_items:
    - "{{ admin_group }}"
    - docker

- name: Create admin user groups
  become: true
  ansible.builtin.group:
    name: "{{ item.name }}"
  with_items: "{{ admin_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Create admin user accounts
  become: true
  ansible.builtin.user:
    name: "{{ item.name }}"
    shell: /bin/bash
    create_home: true
    append: true
    groups: "{{ item.name }},{{ admin_group }},docker"
  with_items: "{{ admin_users }}"
  loop_control:
    label: "{{ item.name }}"

- name: Deployer sudo permissions file - /etc/sudoers.d/[admin-user]
  become: true
  ansible.builtin.template:
    src: sudoer_file.sudo
    dest: "/etc/sudoers.d/{{ item.name }}"
    owner: root
    group: root
    mode: "0440"
  with_items: "{{ admin_users }}"
  loop_control:
    label: "{{ item.name }}"

# 'admins.json' is the single source of truth for admin access, so the file is written
# exclusively: a key placed by hand or left over from an older bootstrap must not outlive
# its removal from that file.
- name: SSH keys - authorize exactly the keys listed for each admin user
  become: true
  ansible.posix.authorized_key:
    user: "{{ item.name }}"
    key: "{{ item.ssh_keys | join('\n') }}"
    exclusive: true
    state: present
  loop: "{{ admin_users }}"
  loop_control:
    label: "{{ item.name }}"

# The role's own sudoers file goes first, so that grant is gone even if deleting the
# account fails. cloud-init's /etc/sudoers.d/90-cloud-init-users is not touched; it is
# inert once the account is gone.
- name: Removed admins - delete sudoers file
  become: true
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ item }}"
    state: absent
  loop: "{{ removed_admins }}"

# The home directory is kept for recovery and audit. 'force' deletes the account even
# while its owner is logged in, which would otherwise fail the apply; that live session
# survives until killed.
- name: Removed admins - delete account
  become: true
  ansible.builtin.user:
    name: "{{ item }}"
    state: absent
    remove: false
    force: true
  loop: "{{ removed_admins }}"

- name: Removed admins - delete per-user group
  become: true
  ansible.builtin.group:
    name: "{{ item }}"
    state: absent
  loop: "{{ removed_admins }}"

# Deploy service account - limited to docker pull and service restarts only
- name: Create user for deployment named 'deploy'
  block:
    - name: Deploy user - create group
      become: true
      ansible.builtin.group:
        name: "{{ deploy_user.name }}"
        state: present

    - name: Deploy user - create account
      become: true
      ansible.builtin.user:
        name: "{{ deploy_user.name }}"
        shell: /bin/bash
        create_home: true
        groups: "{{ deploy_user.name }}"
        append: true

    - name: Deploy user - sudoers file
      become: true
      ansible.builtin.template:
        src: deploy_sudoer_file.sudo
        dest: "/etc/sudoers.d/{{ deploy_user.name }}"
        owner: root
        group: root
        mode: "0440"

    - name: Deploy user - SSH directory
      become: true
      ansible.builtin.file:
        path: "/home/{{ deploy_user.name }}/.ssh/"
        state: directory
        mode: "700"
        owner: "{{ deploy_user.name }}"
        group: "{{ deploy_user.name }}"

    - name: Deploy user - authorized_keys
      become: true
      ansible.posix.authorized_key:
        user: "{{ deploy_user.name }}"
        state: present
        key: "{{ deploy_user.ssh_key }}"
