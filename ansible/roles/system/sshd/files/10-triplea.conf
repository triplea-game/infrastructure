# Managed by ansible (roles/system/sshd) — local edits are overwritten.
#
# sshd keeps the FIRST value it sees for a keyword, so the lowest-numbered
# drop-in in /etc/ssh/sshd_config.d wins; '10-' places this ahead of
# cloud-init's '50-cloud-init.conf' on terraform-provisioned hosts.

PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin prohibit-password
X11Forwarding no
