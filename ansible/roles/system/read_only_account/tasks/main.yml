---
# Read-only account (see group_vars/all.yml: read_only_user).
# Reads logs from the host journal via its adm/systemd-journal group membership.
# The docker-compose services log to journald under a stable tag, so the account
# needs no sudo at all. Deliberately has no other privileges.
- name: Read only account - create group
  become: true
  ansible.builtin.group:
    name: "{{ read_only_user.name }}"
    state: present

- name: Read only account - create account (journald read via adm/systemd-journal)
  become: true
  ansible.builtin.user:
    name: "{{ read_only_user.name }}"
    shell: /bin/bash
    create_home: true
    append: true
    groups:
      - "{{ read_only_user.name }}"
      - adm
      - systemd-journal

- name: Read only account - authorized_keys
  become: true
  ansible.posix.authorized_key:
    user: "{{ read_only_user.name }}"
    key: "{{ read_only_user.ssh_key }}"
    state: present

# Logs now read from journald with no sudo, so the former docker-logs grant is
# gone; remove any file left on hosts provisioned before that change.
- name: Read only account - remove obsolete docker-logs sudoers
  become: true
  ansible.builtin.file:
    path: "/etc/sudoers.d/{{ read_only_user.name }}"
    state: absent
