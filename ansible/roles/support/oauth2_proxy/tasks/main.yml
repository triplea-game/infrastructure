---
# oauth2-proxy is deployed on the LOBBY host (this role is listed under the
# lobby play, alongside support/nginx_conf), because nginx must reach it on
# loopback for the auth_request subrequest. It does NOT run on the support box.
- name: Create oauth2-proxy group
  become: true
  ansible.builtin.group:
    name: oauth2-proxy
    state: present

- name: Create oauth2-proxy user
  become: true
  ansible.builtin.user:
    name: oauth2-proxy
    group: oauth2-proxy
    groups: docker
    state: present
    system: true
    create_home: false

- name: Create oauth2-proxy working directory
  become: true
  ansible.builtin.file:
    state: directory
    mode: "0755"
    owner: oauth2-proxy
    group: oauth2-proxy
    path: "{{ oauth2_proxy_working_directory }}"

- name: Deploy docker-compose.yml
  become: true
  notify: Restart_oauth2_proxy
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ oauth2_proxy_working_directory }}/docker-compose.yml"
    mode: "0644"
    owner: oauth2-proxy
    group: oauth2-proxy

- name: Deploy .env (vault-sourced secrets)
  become: true
  notify: Restart_oauth2_proxy
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ oauth2_proxy_working_directory }}/.env"
    mode: "0600"
    owner: oauth2-proxy
    group: oauth2-proxy

- name: Deploy oauth2-proxy systemd service
  become: true
  notify: Restart_oauth2_proxy
  ansible.builtin.template:
    src: oauth2-proxy.service.j2
    dest: /etc/systemd/system/oauth2-proxy.service
    owner: root
    group: root
    mode: "0644"

- name: Daemon-reload, enable and start oauth2-proxy
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: oauth2-proxy.service
    enabled: true
    state: started
