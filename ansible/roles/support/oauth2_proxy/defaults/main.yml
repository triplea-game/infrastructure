---
# oauth2-proxy runs on the LOBBY host (co-located with nginx), bound to
# loopback 127.0.0.1:4180. nginx performs an auth_request subrequest against it
# and forwards *sanitized* X-Auth-* identity headers to the support backend.
#
# This mirrors the local docker-compose.auth.yml overlay in the support-server
# repo, with production values: secure cookies (TLS terminates at nginx) and the
# real prod callback URL.

oauth2_proxy_working_directory: /opt/oauth2-proxy
oauth2_proxy_image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
oauth2_proxy_listen_address: 127.0.0.1:4180

# Public URL nginx serves; oauth2-proxy redirects back here after GitHub login.
oauth2_proxy_redirect_url: https://prod.triplea-game.org/oauth2/callback
oauth2_proxy_whitelist_domain: prod.triplea-game.org

# <org>:<team-slug> whose members are MapAdmins (write access). MUST match the
# support app's app.auth.map-admin-group. The prod support container does not
# set GITHUB_ADMIN_TEAM, so the app uses its default of this same value — keep
# them in sync or the proxy gate and the app check will drift.
oauth2_proxy_github_team: "triplea-maps:mapadmins"

# --- Secrets (MUST be vault-encrypted before deploy) --------------------------
#
#   TRIPLEA_ANSIBLE_VAULT_PASSWORD=... \
#     ansible-vault encrypt_string --vault-id ./vault-password.sh \
#     'the-secret-value' --name 'oauth2_proxy_client_secret'
#
# and paste the resulting `!vault |` block in place of the "VAULT_TODO" string
# (see database_password in roles/support/service/defaults/main.yml for the
# exact on-disk format).
#
# - client id/secret: from a GitHub OAuth App whose Authorization callback URL
#   is oauth2_proxy_redirect_url above (GitHub -> Settings -> Developer settings
#   -> OAuth Apps). Register a dedicated PROD app for this.
# - cookie secret: 32 random bytes, url-safe base64. Generate with:
#     python3 -c 'import os,base64;print(base64.urlsafe_b64encode(os.urandom(32)).decode())'
oauth2_proxy_client_id: !vault |
