---
- name: Assert the support hostname is set
  ansible.builtin.assert:
    that:
      - support_hostname | default('') | length > 0
    fail_msg: >-
      support_hostname must be set (group_vars/all.yml) so lobby's nginx knows
      the public DNS name to proxy the support backend to over TLS.

- name: Create dir /etc/nginx/include/
  become: true
  ansible.builtin.file:
    path: /etc/nginx/include/
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install nginx config to /etc/nginx/include/
  become: true
  notify: Reload_nginx
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: /etc/nginx/include/{{ item.target }}
    mode: "0644"
    owner: root
    group: root
  with_items:
    - src: pre-server-support.conf
      target: pre-server-support.conf
    - src: server-support.conf
      target: server-support.conf
