# Upstream for the support server. It runs on its own Linode and is reached over
# the public internet by DNS name and TLS ({{ support_hostname }}); the support
# host terminates HTTPS and proxies to the app on loopback. keepalive holds a
# pool of warm connections so the cross-box hop avoids a fresh handshake per
# request. The name is resolved when nginx loads config, so a support rebuild
# (new IP) needs an nginx reload here — but not a config change.
#
# The locations that use this upstream set proxy_ssl_server_name / proxy_ssl_name
# for SNI, which a named TLS upstream with keepalive requires.
upstream support_backend {
    server {{ support_hostname }}:443;
    keepalive 16;
}

# oauth2-proxy runs on THIS (lobby) host on loopback. nginx calls it for the
# /oauth2/* endpoints and the /oauth2/auth auth subrequest. Deployed by the
# support/oauth2_proxy role.
upstream oauth2_proxy {
    server 127.0.0.1:4180;
}
