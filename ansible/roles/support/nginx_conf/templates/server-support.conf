# Reverse-proxy + auth gate for the support server.
#
# support runs on its own Linode (reached via the 'support_backend' upstream in
# pre-server-support.conf). oauth2-proxy runs on THIS host (lobby) on loopback
# (the 'oauth2_proxy' upstream). nginx terminates TLS, performs an auth_request
# subrequest against oauth2-proxy, and forwards *sanitized* X-Auth-* identity
# headers to the support backend. Mirrors the local auth/nginx.conf overlay.
#
# SECURITY: every location that reaches support sets X-Auth-Email / X-Auth-Groups
# explicitly (from the auth subrequest, or to empty) so a browser can never spoof
# identity by sending its own X-Auth-* headers — proxy_set_header overwrites any
# client-supplied value. Do not add a /support route that omits these.

# --- oauth2-proxy endpoints: sign-in / callback / sign-out ---
location ^~ /oauth2/ {
      proxy_pass              http://oauth2_proxy;
      proxy_set_header        Host $host;
      proxy_set_header        X-Real-IP $remote_addr;
      proxy_set_header        X-Forwarded-Proto $scheme;
      proxy_set_header        X-Forwarded-Host $host;
    }

# Internal auth check. Returns 202 (authenticated) or 401 (not). Body not forwarded.
location = /oauth2/auth {
      internal;
      proxy_pass              http://oauth2_proxy;
      proxy_pass_request_body off;
      proxy_set_header        Content-Length "";
      proxy_set_header        Host $host;
      proxy_set_header        X-Real-IP $remote_addr;
      proxy_set_header        X-Forwarded-Uri $request_uri;
    }

# --- Hard-gated: admin / attribute catalog (MapAdmins only). Anonymous -> login.
# Longer prefix than /support below, so it wins for /support/admin/*. ---
location ^~ /support/admin/ {
      auth_request /oauth2/auth;
      error_page 401 = @oauth2_signin;

      auth_request_set $auth_email  $upstream_http_x_auth_request_email;
      auth_request_set $auth_groups $upstream_http_x_auth_request_groups;

      proxy_pass              http://support_backend;
      # HTTP/1.1 + empty Connection header are required for upstream keepalive.
      proxy_http_version      1.1;
      proxy_set_header        Connection "";
      proxy_set_header        X-Auth-Email $auth_email;
      proxy_set_header        X-Auth-Groups $auth_groups;
      proxy_set_header        Host $host;
      proxy_set_header        X-Real-IP $remote_addr;
      proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header        X-Forwarded-Proto $scheme;
      proxy_read_timeout  90;
    }

# --- Optional-auth: all public /support pages (index, status, maps listing...).
# Authenticated -> identity headers; anonymous -> empty (via @optional_anon). ---
location ^~ /support {
      auth_request /oauth2/auth;
      error_page 401 = @optional_anon;

      auth_request_set $auth_email  $upstream_http_x_auth_request_email;
      auth_request_set $auth_groups $upstream_http_x_auth_request_groups;

      proxy_pass              http://support_backend;
      proxy_http_version      1.1;
      proxy_set_header        Connection "";
      proxy_set_header        X-Auth-Email $auth_email;
      proxy_set_header        X-Auth-Groups $auth_groups;
      proxy_set_header        Host $host;
      proxy_set_header        X-Real-IP $remote_addr;
      proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header        X-Forwarded-Proto $scheme;
      proxy_read_timeout  90;
    }

# Anonymous fall-through for the optional-auth pages: sanitized (empty) identity.
location @optional_anon {
      proxy_pass              http://support_backend;
      proxy_http_version      1.1;
      proxy_set_header        Connection "";
      proxy_set_header        X-Auth-Email "";
      proxy_set_header        X-Auth-Groups "";
      proxy_set_header        Host $host;
      proxy_set_header        X-Real-IP $remote_addr;
      proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header        X-Forwarded-Proto $scheme;
      proxy_read_timeout  90;
    }

# Redirect to oauth2-proxy login, preserving the originally-requested URL.
location @oauth2_signin {
      return 302 /oauth2/start?rd=$scheme://$host$request_uri;
    }
