---
- name: Create support group
  become: true
  ansible.builtin.group:
    name: support
    state: present

- name: Create support user
  become: true
  ansible.builtin.user:
    name: support
    group: support
    groups: docker
    state: present
    system: true
    create_home: false

- name: Create support working directory
  become: true
  ansible.builtin.file:
    state: directory
    mode: "0755"
    owner: support
    group: support
    path: "{{ support_working_directory }}"

# The app is published on loopback only (docker-compose.yml.j2) and fronted by
# nginx on this host (support/public_nginx terminates TLS on 443, scoped to
# lobby). The private-IP exposure of 8010 is gone, so the rules that scoped it
# are removed here; these converge a host previously deployed with the
# private-IP model and are no-ops afterwards.
- name: Remove obsolete lobby -> 8010 private-network ufw rule
  become: true
  community.general.ufw:
    rule: allow
    from_ip: "{{ hostvars[groups['lobby'][0]].private_ip }}"
    port: "8010"
    proto: tcp
    delete: true
  when: hostvars[groups['lobby'][0]].private_ip | default('') | length > 0

- name: Remove obsolete DOCKER-USER 8010 restriction
  become: true
  notify: Reload_ufw
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    marker: "# {mark} ANSIBLE MANAGED BLOCK: support 8010 DOCKER-USER"
    state: absent

- name: Deploy docker-compose.yml
  become: true
  notify: Restart_support
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ support_working_directory }}/docker-compose.yml"
    mode: "0644"
    owner: support
    group: support

- name: Deploy .env
  become: true
  notify: Restart_support
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ support_working_directory }}/.env"
    mode: "0600"
    owner: support
    group: support

- name: Deploy support systemd service
  become: true
  notify: Restart_support
  register: support_unit_file
  ansible.builtin.template:
    src: support.service.j2
    dest: /etc/systemd/system/support.service
    owner: root
    group: root
    mode: "0644"

- name: Daemon-reload, enable and start the support service
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: support.service
    enabled: true
    state: started

- name: Configure user for CICD deployments - user named 'deploy'
  block:
    # Root-owned rather than support-owned: the sudoers Cmnd_Alias lets
    # 'deploy' run this as 'support', so 'support' needs execute on it but must
    # not be able to edit what 'deploy' will run.
    - name: Deploy deploy-support.sh
      become: true
      ansible.builtin.template:
        src: deploy-support.sh.j2
        dest: "{{ support_working_directory }}/deploy-support.sh"
        owner: root
        group: root
        mode: "0755"

    - name: Deploy sudoers entry for deploy user - /etc/sudoers.d/deploy-support
      become: true
      ansible.builtin.template:
        src: deploy-support-sudoers.j2
        dest: /etc/sudoers.d/deploy-support
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
