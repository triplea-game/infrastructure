---
- name: Create support group
  become: true
  ansible.builtin.group:
    name: support
    state: present

- name: Create support user
  become: true
  ansible.builtin.user:
    name: support
    group: support
    groups: docker
    state: present
    system: true
    create_home: false

- name: Create support working directory
  become: true
  ansible.builtin.file:
    state: directory
    mode: "0755"
    owner: support
    group: support
    path: "{{ support_working_directory }}"

# SSH (port 22) is already allowed on every host by the system/firewall role
# (rule: limit, port: ssh), so support is reachable like any other box.
# Here we only open the app port, scoped to the lobby box's private IP, since
# lobby's nginx is the sole thing that proxies in over the private network.
- name: Assert lobby's private IP is resolvable (source for the support port rule)
  ansible.builtin.assert:
    that:
      - groups['lobby'] | default([]) | length > 0
      - hostvars[groups['lobby'][0]].private_ip | default('') | length > 0
    fail_msg: >-
      Cannot determine lobby's private IP to scope the support firewall rule.
      Ensure the lobby host is provisioned with private_ip = true.

- name: Allow lobby -> support app port (8010) over the private network
  become: true
  community.general.ufw:
    rule: allow
    from_ip: "{{ hostvars[groups['lobby'][0]].private_ip }}"
    port: "8010"
    proto: tcp

# The allow rule above states the intent but cannot enforce it. Docker
# publishes a port by DNAT'ing it into its own DOCKER chain in FORWARD, which
# netfilter reaches before ufw's INPUT chains — published-port traffic is
# never seen by ufw at all. That leaves 8010 open to anything that can route
# to this host's private IP, and on Linode the 192.168.0.0/17 private network
# is one flat segment shared by every Linode in the datacenter, across
# accounts; the support backend trusts X-Auth-Email/X-Auth-Groups on the
# assumption lobby's nginx is its only caller, so an open 8010 is forgeable
# MapAdmin. DOCKER-USER is the seam Docker leaves for exactly this: consulted
# first for forwarded traffic and never flushed by Docker. Persisting it in
# '/etc/ufw/after.rules' gets boot and 'ufw reload' for free — ufw-init pipes
# that file through 'iptables-restore -n', where the ':DOCKER-USER - [0:0]'
# declaration flushes the chain before the -A lines refill it, so reloads
# cannot stack duplicates (verified against ufw 0.36.2 / iptables 1.8.11).
# Boot order is a non-issue in both directions: Docker's jump lives in
# FORWARD, not inside DOCKER-USER, so the declaration cannot wipe it, and
# Docker tolerates the chain already existing.
- name: Enforce the lobby-only restriction on 8010 in DOCKER-USER
  become: true
  notify: Reload_ufw
  ansible.builtin.blockinfile:
    path: /etc/ufw/after.rules
    marker: "# {mark} ANSIBLE MANAGED BLOCK: support 8010 DOCKER-USER"
    owner: root
    group: root
    mode: "0640"
    block: |
      *filter
      :DOCKER-USER - [0:0]
      -A DOCKER-USER -p tcp --dport 8010 -s {{ hostvars[groups['lobby'][0]].private_ip }} -j RETURN
      # NEW only, so replies and established flows are unaffected. DOCKER-USER
      # sees both directions, but nothing on this host dials out to a :8010.
      -A DOCKER-USER -p tcp --dport 8010 -m conntrack --ctstate NEW -j DROP
      -A DOCKER-USER -j RETURN
      COMMIT

- name: Deploy docker-compose.yml
  become: true
  notify: Restart_support
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ support_working_directory }}/docker-compose.yml"
    mode: "0644"
    owner: support
    group: support

- name: Deploy .env
  become: true
  notify: Restart_support
  ansible.builtin.template:
    src: .env.j2
    dest: "{{ support_working_directory }}/.env"
    mode: "0600"
    owner: support
    group: support

- name: Deploy support systemd service
  become: true
  notify: Restart_support
  register: support_unit_file
  ansible.builtin.template:
    src: support.service.j2
    dest: /etc/systemd/system/support.service
    owner: root
    group: root
    mode: "0644"

- name: Daemon-reload, enable and start the support service
  become: true
  ansible.builtin.systemd_service:
    daemon_reload: true
    name: support.service
    enabled: true
    state: started

- name: Configure user for CICD deployments - user named 'deploy'
  block:
    # Root-owned rather than support-owned: the sudoers Cmnd_Alias lets
    # 'deploy' run this as 'support', so 'support' needs execute on it but must
    # not be able to edit what 'deploy' will run.
    - name: Deploy deploy-support.sh
      become: true
      ansible.builtin.template:
        src: deploy-support.sh.j2
        dest: "{{ support_working_directory }}/deploy-support.sh"
        owner: root
        group: root
        mode: "0755"

    - name: Deploy sudoers entry for deploy user - /etc/sudoers.d/deploy-support
      become: true
      ansible.builtin.template:
        src: deploy-support-sudoers.j2
        dest: /etc/sudoers.d/deploy-support
        owner: root
        group: root
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
