---
- name: Create support db backup directory
  become: true
  ansible.builtin.file:
    state: directory
    path: "{{ support_db_backup_directory }}"
    owner: support
    group: support
    mode: "0750"

# Before the script ships anything, so the first nightly run already has a key
# the lobby host accepts.
- name: Set up the offsite backup key
  vars:
    backup_sender_name: support
    backup_sender_key_path: "{{ support_db_backup_ssh_key_path }}"
  ansible.builtin.import_role:
    name: backup_sender

- name: Deploy support db backup script
  become: true
  ansible.builtin.template:
    src: backup-support-db.sh.j2
    dest: "{{ support_working_directory }}/backup-support-db.sh"
    owner: root
    group: root
    mode: "0755"

- name: Schedule daily support db backup cron job
  become: true
  ansible.builtin.cron:
    name: triplea-support-db-backup
    user: root
    hour: "7"
    minute: "0"
    job: "{{ support_working_directory }}/backup-support-db.sh >> /var/log/triplea-support-db-backup.log 2>&1"

- name: Deploy logrotate config for the support db backup log
  become: true
  ansible.builtin.copy:
    src: logrotate-support-db-backup
    dest: /etc/logrotate.d/triplea-support-db-backup
    owner: root
    group: root
    mode: "0644"
