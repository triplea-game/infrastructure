---
- name: Create lobby db backup directory
  become: true
  ansible.builtin.file:
    state: directory
    path: "{{ lobby_db_backup_directory }}"
    owner: lobby
    group: lobby
    mode: "0750"

- name: Deploy lobby db backup script
  become: true
  ansible.builtin.template:
    src: backup-lobby-db.sh.j2
    dest: "{{ lobby_working_directory }}/backup-lobby-db.sh"
    owner: root
    group: root
    mode: "0755"

- name: Schedule daily lobby db backup cron job
  become: true
  ansible.builtin.cron:
    name: triplea-lobby-db-backup
    user: root
    hour: "7"
    minute: "0"
    job: "{{ lobby_working_directory }}/backup-lobby-db.sh >> /var/log/triplea-lobby-db-backup.log 2>&1"

- name: Deploy logrotate config for the lobby db backup log
  become: true
  ansible.builtin.copy:
    src: logrotate-lobby-db-backup
    dest: /etc/logrotate.d/triplea-lobby-db-backup
    owner: root
    group: root
    mode: "0644"
