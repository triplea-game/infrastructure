location ^~ /lobby {
      proxy_pass              http://127.0.0.1:$lobby_port;
      proxy_set_header        Host $host;
      proxy_set_header        X-Real-IP $remote_addr;
      proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header        X-Forwarded-Proto $scheme;
      proxy_read_timeout  90;
    }

    # Public readiness probe for the lobby-server repo's post-deploy 'smoke'
    # CI job. An exact match, so it wins over the /lobby prefix above and
    # exposes only /q/health/ready, nothing else under /q/. Pinned to the 2.7
    # port because $lobby_port falls back to the retired 8080 when a request
    # carries no Triplea-Version header, as a plain curl doesn't. The UP body
    # is served as-is, so a readiness check that attaches 'data' is public.
    # Rate-limited per client because each hit borrows a DB pool connection.
    location = /lobby/health {
      limit_req               zone=lobby_health burst=10 nodelay;
      limit_req_status        429;
      proxy_pass              http://127.0.0.1:8010/q/health/ready;
      proxy_set_header        Host $host;
      proxy_set_header        X-Real-IP $remote_addr;
      proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header        X-Forwarded-Proto $scheme;

      # A DOWN response carries the datasource's SQLException message (DB host,
      # username), so swap any error body for a fixed one. Without '=' on
      # error_page the upstream status code is kept, which the smoke check
      # relies on.
      proxy_intercept_errors  on;
      error_page 500 502 503 504 @lobby_health_down;
    }

    location @lobby_health_down {
      default_type text/plain;
      # The client still sees the upstream's status, not this 200: see the
      # 'error_page' note above.
      return 200 "DOWN\n";
    }

    # Websocket config
    location ^~ /lobby/game-connection/ws {
      proxy_pass              http://127.0.0.1:$lobby_port;
      proxy_http_version      1.1;
      proxy_set_header        Host $host;
      proxy_set_header        X-Real-IP $remote_addr;
      proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header        X-Forwarded-Proto $scheme;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # Websocket config
    location ^~ /lobby/player-connection/ws {
      proxy_pass              http://127.0.0.1:$lobby_port;
      proxy_http_version      1.1;
      proxy_set_header        Host $host;
      proxy_set_header        X-Real-IP $remote_addr;
      proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header        X-Forwarded-Proto $scheme;

      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
