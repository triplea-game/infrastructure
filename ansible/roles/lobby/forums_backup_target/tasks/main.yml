---
# Receiving side of the forums offsite backup: the forums host rsyncs its
# database dumps here as forums_backup_user, authenticating with the private
# half of forums_backup_public_key (see the 'forums' role's backup.sh.j2).
# That key is confined to a write-only rsync rooted at forums_backup_directory,
# so a compromised forums host cannot shell in or read anything back.
- name: Forums backup - install rsync for the rrsync forced command
  become: true
  ansible.builtin.apt:
    name: rsync
    state: present

- name: Forums backup - create group
  become: true
  ansible.builtin.group:
    name: "{{ forums_backup_user }}"
    state: present

- name: Forums backup - create receiving account
  become: true
  ansible.builtin.user:
    name: "{{ forums_backup_user }}"
    shell: /bin/bash
    create_home: true
    group: "{{ forums_backup_user }}"

# The account keeps an interactive shell because sshd runs the forced command
# through the login shell; nologin would break every push.
- name: Forums backup - authorize the forums host key
  become: true
  ansible.posix.authorized_key:
    user: "{{ forums_backup_user }}"
    key: "{{ forums_backup_public_key }}"
    key_options: 'restrict,command="rrsync -wo {{ forums_backup_directory }}"'
    state: present

- name: Forums backup - create destination directory
  become: true
  ansible.builtin.file:
    path: "{{ forums_backup_directory }}"
    state: directory
    owner: "{{ forums_backup_user }}"
    group: "{{ forums_backup_user }}"
    mode: "0750"

# The forums host ships a fresh dated dump nightly and never deletes the
# received copies, so they accumulate here indefinitely. The 'triplea_forums_db_backup_*'
# glob must stay in sync with the one backup.sh.j2 generates on the forums host —
# a filename-pattern change there needs the same change here.
- name: Forums backup - prune received dumps past the retention window
  become: true
  ansible.builtin.cron:
    name: forums-backup-prune
    user: root
    hour: "8"
    minute: "0"
    job: "find {{ forums_backup_directory }} -maxdepth 1 -type f -name 'triplea_forums_db_backup_*.sql.gz' -mtime +{{ forums_backup_retention_days }} -delete"
