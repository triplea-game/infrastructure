---
# Sending side of an offsite backup. The host generates its own key rather than
# taking a vaulted one, then sets up its lobby/backup_target instance on the
# lobby host, authorizing the public half, in the same run.
- name: Backup sender - require an instance name
  ansible.builtin.assert:
    that:
      - backup_sender_name | length > 0
    fail_msg: "backup_sender needs backup_sender_name set (eg: marti)."

- name: Backup sender - assert the lobby host (receiver) is in inventory
  ansible.builtin.assert:
    that:
      - groups['lobby'] | default([]) | length > 0
    fail_msg: >-
      No lobby host found in inventory. The {{ backup_sender_name }} backup
      rsyncs nightly to the lobby host, and its receiving account there is set
      up by tasks delegated to it; without a lobby host neither can work.

- name: Backup sender - install rsync
  become: true
  ansible.builtin.apt:
    name: rsync
    state: present

- name: Backup sender - create the key directory
  become: true
  ansible.builtin.file:
    path: "{{ backup_sender_key_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

# Creates the key once; later runs leave it alone and just report its public
# half. 'regenerate: never' keeps an existing key even when an edit here stops
# matching it, so changing an option below never silently rotates the key.
# Under --check on a host that has no key yet there is no public half to
# report, so the receiver step below is skipped rather than failed.
- name: Backup sender - generate the backup key for {{ backup_sender_name }}
  become: true
  register: backup_sender_keypair
  community.crypto.openssh_keypair:
    path: "{{ backup_sender_key_path }}"
    type: ed25519
    regenerate: never
    comment: "{{ backup_sender_name }}-backup@{{ inventory_hostname }}"
    owner: root
    group: root
    mode: "0600"

# Imported by path because roles here are grouped per host (lobby/, marti/).
# The receiver's tasks delegate themselves to the lobby host, so this
# provisions the whole instance there: account, jail, prune cron and this key.
- name: Backup sender - provision the receiver on the lobby host  # noqa: role-name[path]
  when: backup_sender_keypair.public_key | default('') | length > 0
  vars:
    backup_target_name: "{{ backup_sender_name }}"
    backup_target_public_key: "{{ backup_sender_keypair.public_key }}"
  ansible.builtin.import_role:
    name: lobby/backup_target
