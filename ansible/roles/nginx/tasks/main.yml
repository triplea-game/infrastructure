---
- name: Apt install nginx
  become: true
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Deploy /etc/nginx/sites-enabled/default default nginx sites_enabled config
  become: true
  notify: Reload_nginx
  ansible.builtin.template:
    src: "prod.default.conf"
    dest: "/etc/nginx/sites-enabled/default"
    owner: root
    group: root
    mode: "0644"

- name: Create /etc/nginx/include/ folder
  become: true
  ansible.builtin.file:
    state: directory
    path: /etc/nginx/include/
    owner: root
    group: root
    mode: "0755"

- name: Ensure nginx is started
  become: true
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true

# 80 is opened alongside 443 so the Certbot-managed port-80 server block in
# prod.default.conf can issue its HTTP->HTTPS 301. Without it, inbound :80 is
# dropped and a bare http:// URL times out instead of redirecting.
- name: Allow firewall ports
  become: true
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "80"
    - "443"
