---
# These variables are used across multiple roles.
# Other than these variables, roles should be fully self-contained.

ansible_connection: ssh
ansible_user: ansible
admin_group: admin
ansible_python_interpreter: /usr/bin/python3

# Public DNS name for the support server. lobby's nginx proxies to it over TLS
# (support/nginx_conf) and the support host terminates HTTPS for it
# (support/public_nginx). The A/AAAA record is managed outside this repo.
support_hostname: support.triplea-game.org

# Former admins to revoke on every host: the system/admin_user role deletes each
# one's account (keeping the home directory) and sudoers file. Removing an admin
# means dropping them from 'terraform/keys/admins.json' and adding them here in
# the same change; a name can leave this list once an apply has reached every
# host (bots skipped as unreachable still have the account).
removed_admins: []

deploy_user:
  name: deploy
  ssh_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJZwah7g0w5b9FjBtW9+psAWuF/dlrIq213C49L8sR1R deploy@triplea"

# Low-privilege, read-only account for agent/debugging access, provisioned by
# the system/read_only_account role. Today it grants log reads only — all from
# the host journal via adm/systemd-journal group membership, no sudo (the
# docker-compose services log to journald under a stable tag); the generic name
# leaves room to add other read-only grants (e.g. R/O DB) later.
# No write access. This account is for LLM use.
read_only_user:
  name: read-only
  ssh_key: |
    ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMDs3/DJcB3Wu3hbtxqbq/4oaqd9Oxw5VJ93favomFUW dan@desk
    ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIB2gL8uQcEEmlTu4qr/ShskSK01aHruPcGL5a313PSja claude-bot@triplea-readonly
