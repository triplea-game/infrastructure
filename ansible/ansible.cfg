# For example with defaults:
# https://raw.githubusercontent.com/ansible/ansible/devel/examples/ansible.cfg

[defaults]
forks = 10
serial = 100%
gathering = explicit
result_format = yaml
# timeout updates the value of ansible_ssh_timeout, default is 10
timeout = 30


[ssh_connection]
pipelining = True
control_path = /tmp/ansible-ssh-%%h-%%p-%%r
ControlMaster = auto
ssh_extra_args = -o StrictHostKeyChecking=accept-new
# Low retry count so an unreachable host is declared dead in ~a minute rather
# than stalling the whole run for ~15+ retrying a blackholed SSH connect.
retries = 3

[inventory]
enable_plugins = linode

