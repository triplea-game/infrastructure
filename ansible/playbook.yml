---
- name: Base system configuration (all hosts)
  hosts: all
  tags: system
  # Bots are disposable and often mid-restart (OOM recycle); an unreachable one
  # must not fail the whole apply. Critical singletons stay strict via their own
  # dedicated plays below, which have no ignore_unreachable and so still fail loud.
  ignore_unreachable: true
  environment:
    DEBIAN_FRONTEND: noninteractive
    NEEDRESTART_MODE: a
  roles:
    # first, so DNS is guaranteed before apt, docker, or anything else that
    # reaches the network — a missing resolver otherwise fails the whole apply.
    - system/resolver
    - name: system/admin_user
      vars:
        admin_users: "{{ lookup('file', playbook_dir + '/../terraform/keys/admins.json') | from_json }}"
    - system/read_only_account
    # after the account roles: their keys must be authorized before password
    # authentication is switched off.
    - system/sshd
    - name: system/apt_packages
      tags: apt
    - system/docker
    - system/firewall
    - system/journald
    - system/logging_config
    # because hostname role may reboot the system, it is executed last. On reboot, any major package updates
    # will take effect & the system will be in a clean/ready state for further host-specific deployments.
    - system/hostname

- name: Configure bot hosts
  hosts: bots
  tags: [bots, bot]
  ignore_unreachable: true
  roles:
    - bot

# support uses the NGINX on the lobby host for reverse proxy
- name: Configure support server
  hosts: support
  tags: support
  roles:
    - support/service
    # nginx + Let's Encrypt TLS front so lobby reaches support over public DNS
    # (support.triplea-game.org) rather than the flat Linode private IP.
    - { name: support/public_nginx, tags: [nginx, public_nginx] }
    - support/db_backup

- name: Configure lobby server
  hosts: lobby
  tags: lobby
  roles:
    - { name: nginx, tags: nginx }
    - lobby/nginx_conf
    # oauth2-proxy is deployed on the lobby host (next to nginx, on loopback) so
    # the /support auth subrequest is local; bring it up before nginx routes to it.
    - { name: support/oauth2_proxy, tags: oauth2_proxy }
    - support/nginx_conf
    - lobby/service
    - lobby/db_backup
    # Receiving side of the forums host's offsite backup rsync. Senders that
    # generate their key at apply time (marti, support) provision their own
    # lobby/backup_target instance from their play, via the backup_sender role.
    - role: lobby/backup_target
      vars:
        backup_target_name: forums
        # Must match the filename the forums role's backup.sh.j2 generates, and
        # keep a timestamp that sorts newest-first; change both together.
        backup_target_file_glob: triplea_forums_db_backup_*.sql.gz
        # Public half of the vaulted 'nodebb_private_key' the forums role
        # deploys to the forums host as its backup key.
        backup_target_public_key: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIAE6Sr1ibMZnujm6Ndu+1ObSANq9iqzrPoq/L3DfaCRY forums-backup"

- name: Configure forums server
  hosts: forums
  tags: forums
  roles:
    - forums

- name: Configure marti dice server
  hosts: marti
  tags: marti
  roles:
    # note: this marti/nginx_conf is not like the lobby or support server, it's a full standalone NGINX config
    - marti/nginx_conf
    - marti/service
    - marti/db_backup
