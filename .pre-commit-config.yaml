repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
        stages: [pre-push]
      - id: check-yaml
        # --unsafe: syntax-only check; skips constructing custom tags like ansible-vault's '!vault'
        args: [--unsafe]
        stages: [pre-push]
      - id: end-of-file-fixer
        stages: [pre-push]
        exclude: ^database/migrations/.*\.sql
      - id: trailing-whitespace
        stages: [pre-push]
        exclude: ^database/migrations/.*\.sql
      - id: check-case-conflict
        stages: [pre-push]
      - id: check-added-large-files
        stages: [pre-push]
      - id: detect-private-key
        stages: [pre-push]
      - id: mixed-line-ending
        stages: [pre-push]

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
        stages: [pre-push]

  - repo: local
    hooks:
      - id: just-format
        name: Format (just format)
        language: system
        entry: just format
        pass_filenames: false
        stages: [pre-push]
